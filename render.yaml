# Render Blueprint: creates the "quoteit-sg" web service from this repository.
# Secret values (sync: false) are typed in the Render dashboard, never saved here.
# Region: Singapore, the same place as the Supabase database (Southeast Asia),
# so every database query is a short trip instead of Frankfurt <-> Singapore.
services:
  - type: web
    name: quoteit-sg
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Tuwaiq Quotes"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: ar
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MEDIA_DISK
        value: uploads
      - key: SEED_DEMO
        value: "true"
